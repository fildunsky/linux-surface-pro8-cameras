# Настройка visage под Surface Pro 8.
[Service]
# Стабильное имя от udev, а не /dev/videoN: номер узла v4l2loopback
# плавает от загрузки к загрузке.
Environment=VISAGE_CAMERA_DEVICE=/dev/surface-ir-camera
# Управление ИК-подсветкой у visage сделано через UVC extension unit, а
# наша камера не UVC — она сидит за IPU6, и подсветкой (если она есть)
# распоряжается сам сенсор. Пусть не пытается и не пишет об этом в лог.
Environment=VISAGE_EMITTER_ENABLED=0
